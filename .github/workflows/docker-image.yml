name: GitHub Docker Image CI
on:
  push:
    branches: [ "release" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 拉取代码
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4

      # 初始化Docker构建工具
      - name: Set up Docker
        id: setup_docker
        uses: docker/setup-buildx-action@v3

      # 登录Docker Hub
      - name: Login to Docker Hub
        id: docker_login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建镜像并推送到
      - name: Build and push ghcr.io image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true # 构建完成自动推送
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        #run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)

        # 仅构建失败时，赋值失败阶段+备注到环境变量
      - name: Set Fail Info Env
        id: set_fail_env
        if: always()
        run: |
          if [[ "${{ steps.checkout.outcome }}" == "failure" ]]; then
            echo "fail_msg=actions/checkout拉取代码失败" >> $GITHUB_ENV
          elif [[ "${{ steps.setup_docker.outcome }}" == "failure" ]]; then
            echo "fail_msg=buildx工具初始化失败" >> $GITHUB_ENV
          elif [[ "${{ steps.docker_login.outcome }}" == "failure" ]]; then
            echo "fail_msg=Docker账号密码密钥错误，登录仓库失败" >> $GITHUB_ENV
          elif [[ "${{ steps.docker_build.outcome }}" == "failure" ]]; then
            echo "fail_stage=Docker镜像构建推送" >> $GITHUB_ENV
            echo "fail_msg=Docker镜像构建推送失败" >> $GITHUB_ENV
          else
            echo "fail_msg=流水线未发现异常" >> $GITHUB_ENV
          fi

      - name: Call Custom Callback API
        if: always()
        run: |
          curl -X POST "https://www.kouleen.cn/api/docker/webhook/put?secret=${{ secrets.HOOK_SECRET }}" \
          -H "Content-Type: application/json" \
          -d '{
            "runId": "${{ github.run_id }}",
            "imageName": "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest",
            "containerName": "${{ github.event.repository.name }}",
            "branch": "${{ github.ref_name }}",
            "repo": "${{ github.repository }}",
            "htmlUrl": "${{ github.event.repository.html_url }}",
            "cloneUrl": "${{ github.event.repository.clone_url }}",
            "sshUrl": "${{ github.event.repository.ssh_url }}",
            "status": "${{ job.status }}",
            "actor": "${{ github.actor }}",
            "commitMessage": "${{ github.event.head_commit.message }}",
            "workflow": "${{ github.workflow }}",
            "triggerType": "${{ github.event_name }}",
            "failRemark": "${{ env.fail_msg }}",
            "networkMode": ["etcd-internal","mysql-internal","redis-internal"],
            "restartPolicy": "",
            "removeOldExist": true,
            "enableIT": true,
            "portMapping": {},
            "envList": [
                "ETCD_ENDPOINTS=${{ secrets.ETCD_ENDPOINTS }}",
                "ADDRESS=${{ secrets.ADDRESS }}",
                "REDIS_ADDR=${{ secrets.REDIS_ADDR }}",
                "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}",
                "REDIS_DB=${{ secrets.REDIS_DB }}",
                "MYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }}",
                "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}",
                "MYSQL_HOST=${{ secrets.MYSQL_HOST }}",
                "MYSQL_PORT=${{ secrets.MYSQL_PORT }}",
                "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}",
                "MYSQL_SLAVE1_USERNAME=${{ secrets.MYSQL_SLAVE1_USERNAME }}",
                "MYSQL_SLAVE1_PASSWORD=${{ secrets.MYSQL_SLAVE1_PASSWORD }}",
                "MYSQL_SLAVE1_HOST=${{ secrets.MYSQL_SLAVE1_HOST }}",
                "MYSQL_SLAVE1_PORT=${{ secrets.MYSQL_SLAVE1_PORT }}",
                "MYSQL_SLAVE1_DATABASE=${{ secrets.MYSQL_SLAVE1_DATABASE }}",
                "MYSQL_SLAVE2_USERNAME=${{ secrets.MYSQL_SLAVE2_USERNAME }}",
                "MYSQL_SLAVE2_PASSWORD=${{ secrets.MYSQL_SLAVE2_PASSWORD }}",
                "MYSQL_SLAVE2_HOST=${{ secrets.MYSQL_SLAVE2_HOST }}",
                "MYSQL_SLAVE2_PORT=${{ secrets.MYSQL_SLAVE2_PORT }}",
                "MYSQL_SLAVE2_DATABASE=${{ secrets.MYSQL_SLAVE2_DATABASE }}",
                "MYSQL_ADDR_LISTENER=${{ secrets.MYSQL_ADDR_LISTENER }}",
                "MYSQL_USER_LISTENER=${{ secrets.MYSQL_USER_LISTENER }}",
                "MYSQL_PASSWORD_LISTENER=${{ secrets.MYSQL_PASSWORD_LISTENER }}",
                "RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}"
            ],
            "volumeBinds": [],
            "cmdOverride": []
          }'

  build-cloud:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Call Custom Callback API
        run: |
          curl -X POST "https://cloud.kouleen.cn/api/docker/webhook/put?secret=${{ secrets.HOOK_SECRET }}" \
          -H "Content-Type: application/json" \
          -d '{
            "runId": "${{ github.run_id }}",
            "imageName": "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest",
            "containerName": "${{ github.event.repository.name }}",
            "branch": "${{ github.ref_name }}",
            "repo": "${{ github.repository }}",
            "htmlUrl": "${{ github.event.repository.html_url }}",
            "cloneUrl": "${{ github.event.repository.clone_url }}",
            "sshUrl": "${{ github.event.repository.ssh_url }}",
            "status": "${{ job.status }}",
            "actor": "${{ github.actor }}",
            "commitMessage": "${{ github.event.head_commit.message }}",
            "workflow": "${{ github.workflow }}",
            "triggerType": "${{ github.event_name }}",
            "failRemark": "${{ env.fail_msg }}",
            "networkMode": ["etcd-internal","mysql-internal","redis-internal"],
            "restartPolicy": "",
            "removeOldExist": true,
            "enableIT": true,
            "portMapping": {},
            "envList": [
                "ETCD_ENDPOINTS=${{ secrets.ETCD_ENDPOINTS }}",
                "ADDRESS=${{ secrets.ADDRESS }}",
                "REDIS_ADDR=${{ secrets.REDIS_ADDR }}",
                "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}",
                "REDIS_DB=${{ secrets.REDIS_DB }}",
                "MYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }}",
                "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}",
                "MYSQL_HOST=${{ secrets.MYSQL_HOST }}",
                "MYSQL_PORT=${{ secrets.MYSQL_PORT }}",
                "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}",
                "MYSQL_SLAVE1_USERNAME=${{ secrets.MYSQL_SLAVE1_USERNAME }}",
                "MYSQL_SLAVE1_PASSWORD=${{ secrets.MYSQL_SLAVE1_PASSWORD }}",
                "MYSQL_SLAVE1_HOST=${{ secrets.MYSQL_SLAVE1_HOST }}",
                "MYSQL_SLAVE1_PORT=${{ secrets.MYSQL_SLAVE1_PORT }}",
                "MYSQL_SLAVE1_DATABASE=${{ secrets.MYSQL_SLAVE1_DATABASE }}",
                "MYSQL_SLAVE2_USERNAME=${{ secrets.MYSQL_SLAVE2_USERNAME }}",
                "MYSQL_SLAVE2_PASSWORD=${{ secrets.MYSQL_SLAVE2_PASSWORD }}",
                "MYSQL_SLAVE2_HOST=${{ secrets.MYSQL_SLAVE2_HOST }}",
                "MYSQL_SLAVE2_PORT=${{ secrets.MYSQL_SLAVE2_PORT }}",
                "MYSQL_SLAVE2_DATABASE=${{ secrets.MYSQL_SLAVE2_DATABASE }}",
                "MYSQL_ADDR_LISTENER=${{ secrets.MYSQL_ADDR_LISTENER }}",
                "MYSQL_USER_LISTENER=${{ secrets.MYSQL_USER_LISTENER }}",
                "MYSQL_PASSWORD_LISTENER=${{ secrets.MYSQL_PASSWORD_LISTENER }}",
                "RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}"
            ],
            "volumeBinds": [],
            "cmdOverride": []
          }'
